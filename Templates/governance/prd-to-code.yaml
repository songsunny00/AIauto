# Templates/governance/prd-to-code.yaml
# 需求 -> 代码 映射模板（落地蓝图 §5.1，按模块级简化）
#
# 用法：
#   复制本文件到目标位置（如 Codes/mappings/prd-to-code.yaml），
#   将 {占位符} 替换为实际值；新增模块时复制 modules 下 - path_code 段。
#
# 作用：
#   把需求模块（二级编码，如 CONFIG/BILLCFG）与对应的前端仓 / 后端仓 /
#   页面入口 / 前端路由 / 菜单路径建立结构化关联，作为
#   "需求 -> 开发 -> 测试"闭环在代码侧的统一主线。
#
# 简化约定：
#   只记录到二级模块，不逐条罗列每个功能点(REQ)的对应关系，避免映射膨胀。
#   如需细化到功能点，可按文件底部『附：REQ 级细化（可选）』补充。
#
# 维护责任（蓝图 §6.4 阶段4：开发实现）：
#   开发角色在实现代码、提交 PR / commit 时持续更新本文件。
#
# 字段说明（按模块聚合）：
#   repo_registry               : 仓库逻辑别名 -> 物理仓目录
#   git_repos                   : 逻辑别名 -> 远程 git 仓库（url/branch/browse），便于回溯源码
#   modules[].path_code         : 二级模块编码（一级/二级，如 CONFIG/BILLCFG）
#   modules[].path_name         : 模块中文路径（如 配置中心/商业化计费配置）
#   modules[].leaf_code         : 末级编码（如 BILLCFG）
#   modules[].leaf_name         : 末级中文名（如 商业化计费配置）
#   modules[].version           : 需求版本（如 V1.6.1）
#   modules[].repos             : 本模块涉及仓库（scope/branch/tag）
#   modules[].pages             : 前端页面入口
#       route                   : 前端路由（如 /config/billingConfig）—— 测试 / 溯源直接用
#       menu                    : 菜单路径（如 配置中心 / 商业化计费配置）—— 与前端菜单一致
#       logical_path            : 蓝图逻辑视图路径（Codes/ 协作视图）
#       repo_path               : 外部代码仓内物理相对路径
#       browse                  : 远程仓库浏览链接
#   modules[].components / apis / services : 待详细设计与开发实现后按需补充

repo_registry:
  frontend: "repos/frontend-repo"
  backend: "repos/backend-repo"

# 实际远程仓库（逻辑别名对应的物理仓），便于从映射直接回溯源码。
git_repos:
  "repos/frontend-repo":
    url: "{frontendGitUrl}"
    branch: "{branch}"
    browse: "{frontendBrowseBase}"
  "repos/backend-repo":
    url: "{backendGitUrl}"
    branch: "{backendBranch}"

# 项目级聚合：每个二级模块一个 section，便于多模块横向维护与治理角色统一汇总。
modules:

  # ============ {模块中文名}（{version}） ============
  # 来源：{需求文档路径}（模块编码主线 {一级}/{二级}）
  - path_code: "{一级}/{二级}"
    path_name: "{一级中文}/{二级中文}"
    leaf_code: "{二级}"
    leaf_name: "{二级中文}"
    version: "{version}"
    repos:
      - repo: "repos/frontend-repo"
        scope: "frontend"
        branch: "{branch}"
        tag: "{tagName}"        # 按需填写
    pages:
      - repo: "repos/frontend-repo"
        logical_path: "Codes/frontend/src/views/{module}"
        repo_path: "src/views/{module}"
        route: "/{route}"                       # 前端路由（必填：与前端 router 一致）
        menu: "{一级中文} / {二级中文}"           # 菜单路径（必填：与前端菜单一致）
        browse: "{frontendBrowseBase}/src/views/{module}"
        note: "模块前端入口（路由 /{route}；菜单：{一级中文} / {二级中文}）"
    # components / apis / services 待详细设计与开发实现后按需补充：
    # components:
    #   - repo: "repos/frontend-repo"
    #     logical_path: "Codes/frontend/src/components/{module}/{component}.vue"
    #     repo_path: "src/components/{module}/{component}.vue"
    #     note: "页面组件或弹窗组件"
    # apis:
    #   - repo: "repos/backend-repo"
    #     name: "{apiName}"
    #     method: "GET"
    #     path: "/api/v1/{path}"
    #     logical_path: "Codes/backend/src/main/java/{module}/{controller}.java"
    #     repo_path: "src/main/java/{module}/{controller}.java"
    # services:
    #   - repo: "repos/backend-repo"
    #     logical_path: "Codes/backend/src/main/java/{module}/{service}.java"
    #     repo_path: "src/main/java/{module}/{service}.java"
    #     note: "后端服务实现"

  # ============ 新增模块时，复制上面 - path_code 段并修改模块编码 / 路径 ============

